# Keeps the flake's baked dependency hashes in step with the two files that
# decide them: bun.lock (the bunCache fixed-output derivation) and
# packages/electron/package.json (the pinned OpenCode CLI tag). When either
# moves on main, this workflow bakes every declared platform sequentially —
# x86_64-linux first (it may move the opencode tag), then aarch64-linux and
# aarch64-darwin, each building on the previous leg's branch — and opens one
# PR carrying every platform's hashes. The nix-build matrix proves each
# platform's hash on its own runner before that PR can merge.
name: nix-hashes

on:
  push:
    branches: [main]
    paths:
      - bun.lock
      - packages/electron/package.json
  workflow_dispatch:

permissions: {}

concurrency:
  group: nix-hashes
  cancel-in-progress: false

jobs:
  bake-x86_64-linux:
    runs-on: ubuntu-24.04
    outputs:
      pushed: ${{ steps.bake.outputs.pushed }}
    steps:
      # The bake PR is opened with the review app, not GITHUB_TOKEN: an
      # App-opened PR gets normal CI (the nix-build matrix runs on it), and
      # the repo doesn't need the "Allow GitHub Actions to create and
      # approve pull requests" toggle. The token carries only the two
      # permissions the bake needs.
      - id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.OC_REVIEW_APP_ID }}
          private-key: ${{ secrets.OC_REVIEW_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - id: bake
        uses: ./.github/actions/nix-bake
        with:
          app-token: ${{ steps.app-token.outputs.token }}
          system: x86_64-linux
          create-pr: true

  bake-aarch64-linux:
    needs: bake-x86_64-linux
    runs-on: ubuntu-24.04-arm
    steps:
      - id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.OC_REVIEW_APP_ID }}
          private-key: ${{ secrets.OC_REVIEW_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: ./.github/actions/nix-bake
        with:
          app-token: ${{ steps.app-token.outputs.token }}
          system: aarch64-linux
          # Only build on the previous leg's entries when it pushed; a
          # no-op leg means this system should start from main's state.
          base-ref: ${{ needs.bake-x86_64-linux.outputs.pushed == 'true' && 'nix/hash-bake' || '' }}

  bake-aarch64-darwin:
    needs: bake-aarch64-linux
    runs-on: macos-15
    steps:
      - id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.OC_REVIEW_APP_ID }}
          private-key: ${{ secrets.OC_REVIEW_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: ./.github/actions/nix-bake
        with:
          app-token: ${{ steps.app-token.outputs.token }}
          system: aarch64-darwin
          base-ref: ${{ needs.bake-aarch64-linux.outputs.pushed == 'true' && 'nix/hash-bake' || '' }}
